# TLS front for the Identity host in the conformance environment. The suite
# reaches the OP at https://identity-op.test/ through this proxy.
worker_processes auto;
events { worker_connections 1024; }
http {
    # Docker's embedded DNS, with the upstream in a variable, so nginx resolves
    # the Identity container at request time instead of refusing to start when
    # the name is not in DNS yet.
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 443 ssl;
        server_name identity-op.test;
        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        # FAPI 2.0 checks the TLS of the issuer against BCP 195
        # (RequireOnlyBCP195RecommendedCiphersForTLS12): only TLS 1.2 with
        # AEAD ECDHE suites, plus TLS 1.3.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        large_client_header_buffers 8 32k;
        location / {
            set $identity_upstream "identity:8080";
            proxy_pass http://$identity_upstream;
        }
    }
}
