worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate zone for token endpoint (matches the STS's own rate limiter, but
    # defense in depth at the proxy too).
    limit_req_zone $binary_remote_addr zone=token:10m rate=30r/m;

    upstream sts {
        server sts:8080;
    }

    # ---- HTTP → HTTPS redirect ----
    server {
        listen 80;
        server_name _;
        return 301 https://$host:5001$request_uri;
    }

    # ---- HTTPS (self-signed cert generated by gen-cert.sh) ----
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Proxy headers — the STS reads these via ForwardedHeaders middleware
        # (TrustedProxies must include the Docker network CIDR).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Blazor Server SignalR WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_buffering off;

        # Rate-limit the token endpoint (defense in depth)
        location = /connect/token {
            limit_req zone=token burst=10 nodelay;
            proxy_pass http://sts;
        }

        # Everything else
        location / {
            proxy_pass http://sts;
        }
    }
}
