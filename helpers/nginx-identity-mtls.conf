# Dedicated mTLS listener for the production Identity service.
#
# Include this server block from the host's nginx sites-enabled directory. It
# deliberately uses a separate public port and a loopback Kestrel endpoint:
# the existing :443 and :26501 listeners keep their current behavior, while
# only RFC 8705 aliases on :26502 request a client certificate.
#
# The proxy uses optional_no_ca because self_signed_tls_client_auth certificates
# are intentionally not trusted by nginx. The Identity service receives the
# certificate and performs the exact client binding and, when configured, PKI
# chain/revocation validation. A request without a certificate is rejected at
# the edge before it reaches the mTLS Kestrel endpoint.

server {
    listen 26502 ssl;
    listen [::]:26502 ssl;

    server_name _;
    include snippets/certificate-sufficit-generic.conf;

    ssl_verify_client optional_no_ca;
    large_client_header_buffers 4 64k;

    access_log /var/log/nginx/sufficit-identity-access.log identity_sanitized;
    error_log /var/log/nginx/sufficit-identity-mtls.log;

    # RFC 8705 endpoint aliases. The certificate is forwarded only here;
    # ordinary requests never reach the certificate-aware Kestrel listener.
    location ~* ^/connect/(token|introspect|revocation|deviceauthorization|userinfo|par)/mtls/?$ {
        if ($ssl_client_raw_cert = "") { return 400; }

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host identity.sufficit.com.br;
        proxy_set_header X-Sufficit-Client-Certificate $ssl_client_escaped_cert;

        proxy_read_timeout 180;
        proxy_pass http://127.0.0.1:26504;
    }

    # Health, discovery and accidental non-mTLS paths remain available on the
    # dedicated service port without being sent a client-certificate header.
    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host identity.sufficit.com.br;
        proxy_set_header X-Sufficit-Client-Certificate "";

        proxy_read_timeout 180;
        proxy_pass http://unix:/run/sufficit-identity/identity.sock:;
    }
}
