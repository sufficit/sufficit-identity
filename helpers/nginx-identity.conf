# Sufficit Identity — castrum-apps test nginx reverse proxy configuration
#
# Proxy HTTPS -> Unix domain socket (Kestrel, no TCP port, no internal TLS).
# This is the versioned source for the test virtual host installed at:
#   /etc/nginx/sites-available/sufficit-identity-test
#
# Passkey authentication tickets are stored server-side by the application.
# Do not compensate for ticket/cookie growth with proxy response buffers here.
# `large_client_header_buffers` applies only to request headers received from
# the browser and is not the fix for `upstream sent too big header`.
#
# Install:
#   cp helpers/nginx-identity.conf /etc/nginx/sites-available/sufficit-identity-test
#   ln -sf /etc/nginx/sites-available/sufficit-identity-test /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 26501 ssl;
    listen [::]:26501 ssl;

    server_name castrum-apps.sufficit.com.br;

    # Let's Encrypt wildcard cert (shared across Sufficit services)
    include snippets/certificate-sufficit-generic.conf;

    # Blazor Server + OIDC can produce large headers (cookies with auth state)
    large_client_header_buffers 4 64k;

    error_log /var/log/nginx/sufficit-identity-test.log;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy to Kestrel via Unix domain socket — no TCP port consumed,
        # no TLS between nginx and Kestrel (localhost is trusted).
        proxy_pass http://unix:/run/sufficit-identity/identity.sock:;

        # Blazor Server needs WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
    }
}
