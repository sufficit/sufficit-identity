# Sufficit Identity — nginx reverse proxy configuration
#
# Proxy HTTPS -> Unix domain socket (Kestrel, no TCP port, no internal TLS).
# The server_name and listen port should match the deployment:
#   - castrum-apps (test): listen 26501 ssl; server_name castrum-apps.sufficit.com.br;
#   - eveo-apps (prod):    listen 26505 ssl; server_name identity.sufficit.com.br;
#
# Install:
#   cp helpers/nginx-identity.conf /etc/nginx/sites-available/sufficit-identity
#   ln -sf /etc/nginx/sites-available/sufficit-identity /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 26501 ssl;
    listen [::]:26501 ssl;

    server_name castrum-apps.sufficit.com.br;

    # Let's Encrypt wildcard cert (shared across Sufficit services)
    include snippets/certificate-sufficit-generic.conf;

    # Blazor Server + OIDC can produce large headers (cookies with auth state)
    large_client_header_buffers 4 64k;

    error_log /var/log/nginx/sufficit-identity.log;

    location / {
        # Proxy to Kestrel via Unix domain socket — no TCP port consumed,
        # no TLS between nginx and Kestrel (localhost is trusted).
        proxy_pass http://unix:/run/sufficit-identity/identity.sock:;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Blazor Server needs WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;

        # Timeout for long-running OIDC consent flows
        proxy_read_timeout 120s;
    }
}
