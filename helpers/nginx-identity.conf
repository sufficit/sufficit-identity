# Sufficit Identity — castrum-apps test nginx reverse proxy configuration
#
# Proxy HTTPS -> Unix domain socket (Kestrel, no TCP port, no internal TLS).
# This is the versioned source for the test virtual host installed at:
#   /etc/nginx/sites-available/sufficit-identity-test
#
# Passkey authentication tickets are stored server-side by the application.
# Do not compensate for ticket/cookie growth with proxy response buffers here.
# `large_client_header_buffers` applies only to request headers received from
# the browser and is not the fix for `upstream sent too big header`.
#
# Install:
#   cp helpers/nginx-identity.conf /etc/nginx/sites-available/sufficit-identity-test
#   ln -sf /etc/nginx/sites-available/sufficit-identity-test /etc/nginx/sites-enabled/
#   nginx -t && systemctl restart nginx
# castrum-apps uses restart deliberately: its packaged nginx has previously
# crashed while rebuilding configuration state during a reload.

# These directives live at the http context because Debian/Ubuntu load
# sites-enabled/* from inside http { }. Endpoint selection is performed with
# locations instead of conditional map keys: the nginx version on castrum-apps
# has proven unstable while rebuilding a large variables hash during reload.
limit_req_zone $binary_remote_addr zone=identity_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=identity_static:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=identity_protocol:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=identity_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=identity_csp_report:1m rate=5r/s;

server {
    listen 26501 ssl;
    listen [::]:26501 ssl;

    server_name castrum-apps.sufficit.com.br;

    # Let's Encrypt wildcard cert (shared across Sufficit services)
    include snippets/certificate-sufficit-generic.conf;

    # Blazor Server + OIDC can produce large headers (cookies with auth state)
    large_client_header_buffers 4 64k;

    error_log /var/log/nginx/sufficit-identity-test.log;

    # Limits are selected per location below. Do not place a general limit at
    # server scope: browsers fetch CSS, fonts, scripts and Blazor assets in a
    # parallel burst, and inheriting the interactive bucket here can leave the
    # page unstyled or prevent the circuit from starting.
    limit_req_status 429;
    limit_req_log_level warn;

    location = /security/csp-report {
        limit_req zone=identity_csp_report burst=20 nodelay;
        client_max_body_size 16k;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/sufficit-identity/identity.sock:;
    }

    location ~* ^/(connect/(token|introspect|register|ciba/token)|bc-authorize)/?$ {
        limit_req zone=identity_protocol burst=10 nodelay;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/sufficit-identity/identity.sock:;
    }

    location ~* ^/account/(login|loginwith2fa|loginwithrecoverycode|forgotpassword|resetpassword|resendemailconfirmation|register|passkeys/(request-options|authenticate))/?$ {
        limit_req zone=identity_auth burst=5 nodelay;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/sufficit-identity/identity.sock:;
    }

    # Static framework and component assets arrive concurrently during the
    # first render. They retain a high-volume abuse ceiling without sharing the
    # much smaller interactive request bucket.
    location ^~ /_content/ {
        limit_req zone=identity_static burst=200 nodelay;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/sufficit-identity/identity.sock:;
    }

    location ^~ /_framework/ {
        limit_req zone=identity_static burst=200 nodelay;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/sufficit-identity/identity.sock:;
    }

    location / {
        limit_req zone=identity_general burst=20 nodelay;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy to Kestrel via Unix domain socket — no TCP port consumed,
        # no TLS between nginx and Kestrel (localhost is trusted).
        proxy_pass http://unix:/run/sufficit-identity/identity.sock:;

        # Blazor Server needs WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
    }
}
